<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємний Санта</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">

    <meta name="google-site-verification" content="zd5gJxkdtjcMm-kXae1DptFxUEoEupqOiZ-RuCnBH0Q" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8074228941517660"
        crossorigin="anonymous">
        </script>
</head>

<body>
    <div class="snow" aria-hidden="true"></div>

    <header class="christmas-header">
        <img src="tree.svg" class="tree left" alt="" aria-hidden="true">
        <h1>Організатор Таємного Санти</h1>
        <img src="tree.svg" class="tree right" alt="" aria-hidden="true">
    </header>

    <main class="app">
        <section class="add-participant" aria-labelledby="add-heading">
            <h2 id="add-heading" class="visually-hidden">Додати учасника</h2>
            <form id="add-form" class="add-form">
                <label class="visually-hidden" for="name-input">Ім'я учасника</label>
                <input type="text" id="name-input" name="name" placeholder="Ім'я учасника" autocomplete="off" autofocus>
                <button type="submit" id="add-btn">Додати учасника</button>
            </form>
        </section>

        <section id="participants-list" class="participants" aria-labelledby="participants-heading">
            <h2 id="participants-heading">Учасники:</h2>
            <ul id="participants-ul"></ul>
        </section>

        <section id="mode-section" class="mode is-hidden" aria-labelledby="mode-heading">
            <h2 id="mode-heading">Режим жеребкування:</h2>
            <div class="mode-options">
                <label for="mode-with">
                    <input type="radio" name="mode" id="mode-with" value="with">
                    Жеребкування з обмеженнями
                </label>
                <label for="mode-without">
                    <input type="radio" name="mode" id="mode-without" value="without" checked>
                    Жеребкування без обмежень
                </label>
            </div>
        </section>

        <section id="restrictions-section" class="restrictions is-hidden" aria-labelledby="restrictions-heading">
            <h2 id="restrictions-heading">Обмеження:</h2>
            <p>
                Для кожного учасника оберіть, кому він НЕ МОЖЕ дарувати подарунок.
                Обмеження взаємні за замовчуванням.
            </p>
            <div id="restrictions-div"></div>
        </section>

        <section id="generate-section" class="generate is-hidden">
            <button type="button" id="generate-btn">Згенерувати жеребкування</button>
        </section>

        <section id="results-section" class="results is-hidden" aria-labelledby="results-heading">
            <h2 id="results-heading">Результати:</h2>
            <ul id="results-ul"></ul>
            <div class="results-actions">
                <button type="button" id="regen-btn">Нова генерація</button>
                <button type="button" id="reset-btn">Очистити все</button>
            </div>
        </section>
    </main>

    <div id="popup-overlay" class="popup-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="popup-message">
        <div class="popup">
            <p id="popup-message"></p>
            <button type="button" id="popup-close">OK</button>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/algorithm.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
