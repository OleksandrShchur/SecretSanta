name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ClientApp/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix ClientApp ci

      - name: Restore .NET Dependencies
        run: dotnet restore SecretSanta.slnx

      - name: Build Solution
        run: dotnet build SecretSanta.slnx --no-restore --configuration Release

      - name: Run Frontend Tests
        run: npm --prefix ClientApp test

      - name: Run .NET Tests with Code Coverage
        run: |
          dotnet test SecretSanta.slnx --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Install ReportGenerator Tool
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report & Badges
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"Badges;TextSummary;MarkdownSummaryGithub" \
            -classfilters:"-Microsoft.AspNetCore.OpenApi.*;-System.Runtime.*"

      - name: Update Badges & Job Summary
        shell: bash
        run: |
          mkdir -p .github/badges
          
          # Extract Line coverage percentage from Summary.txt
          COVERAGE=$(grep -m 1 "Line coverage:" coveragereport/Summary.txt | awk '{print $3}' | tr -d '%')
          INT_COV=${COVERAGE%.*}
          echo "Overall line coverage is ${COVERAGE}% (${INT_COV}%)"
          
          COLOR="red"
          if [ "$INT_COV" -ge 90 ]; then
            COLOR="brightgreen"
          elif [ "$INT_COV" -ge 80 ]; then
            COLOR="green"
          elif [ "$INT_COV" -ge 70 ]; then
            COLOR="yellowgreen"
          elif [ "$INT_COV" -ge 60 ]; then
            COLOR="yellow"
          elif [ "$INT_COV" -ge 50 ]; then
            COLOR="orange"
          fi
          
          # Copy the appropriate colored shields.io SVG badge
          cp "coveragereport/badge_shieldsio_linecoverage_${COLOR}.svg" .github/badges/coverage.svg
          
          # Create endpoint JSON for shields.io endpoint support
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > .github/badges/coverage.json
          
          # Update build passing badge
          cat << 'EOF' > .github/badges/build.svg
<svg xmlns="http://www.w3.org/2000/svg" width="88" height="20" role="img" aria-label="build: passing"><title>build: passing</title><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="88" height="20" rx="3"/></clipPath><g clip-path="url(#r)"><rect width="37" height="20" fill="#555"/><rect x="37" width="51" height="20" fill="#44cc11"/><rect width="88" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><g transform="scale(.1)"><g aria-hidden="true" fill="#010101"><text x="195" y="150" fill-opacity=".8" filter="url(#blur)" textLength="270">build</text><text x="195" y="150" fill-opacity=".3" textLength="270">build</text></g><text x="195" y="140" textLength="270">build</text></g><g transform="scale(.1)"><g aria-hidden="true" fill="#010101"><text x="615" y="150" fill-opacity=".8" filter="url(#blur)" textLength="410">passing</text><text x="615" y="150" fill-opacity=".3" textLength="410">passing</text></g><text x="615" y="140" textLength="410">passing</text></g></g></svg>
EOF
          echo "{\"schemaVersion\":1,\"label\":\"build\",\"message\":\"passing\",\"color\":\"brightgreen\"}" > .github/badges/build.json

          # Publish Markdown summary to GitHub Actions Step Summary
          if [ -f coveragereport/SummaryGithub.md ]; then
            cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push badges
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update build and coverage badges [skip ci]"
          file_pattern: ".github/badges/*"
